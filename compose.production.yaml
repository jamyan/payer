name: platezhnik

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  APP_ENV: production
  APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
  DATABASE_URL: postgresql+psycopg://platezhnik:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/platezhnik
  OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:?Set OWNER_TELEGRAM_ID}
  AUTH_MODE: telegram
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
  TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-true}
  INIT_DATA_MAX_AGE_SECONDS: ${INIT_DATA_MAX_AGE_SECONDS:-3600}

x-app: &app
  build: ./backend
  image: platezhnik:${APP_VERSION:-1.4.0}
  environment: *app-env
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging
  networks: [backend]

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: platezhnik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: platezhnik
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platezhnik -d platezhnik"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging
    networks: [backend]

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *app
    networks:
      backend:
      proxy:
        aliases: [platezhnik-api]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--no-access-log", "--timeout-graceful-shutdown", "30"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  bot:
    <<: *app
    command: ["python", "-m", "app.bot"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:

networks:
  backend:
  proxy:
    external: true
    name: proxy
